[project]
name = "airseekers-tron-ha"
version = "0.3.1"
description = "Airseekers Tron integration for Home Assistant: local reads, cloud writes"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.9.0",
    "pyairseekers==0.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-homeassistant-custom-component==0.13.367",
    "pyturbojpeg>=2.5.0",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pytest-homeassistant-custom-component ships autouse async fixtures
asyncio_mode = "auto"
